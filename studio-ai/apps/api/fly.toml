# Fly.io (baixo custo, cobrança por uso — exige cartão). Uso: a partir de studio-ai/
#   fly launch --no-deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile
#   fly secrets set SUPABASE_URL=... SUPABASE_ANON_KEY=... SUPABASE_SERVICE_ROLE_KEY=...   (cofre da Fly)
app = "lumpli-api-dev"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DRIVER = "supabase-rest"
  STORAGE_DRIVER = "supabase"
  STORAGE_BUCKET = "studio-private"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"   # desliga sem tráfego (custo ~zero ocioso)
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

[[http_service.checks]]
  path = "/ready"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
